name: Documentation

on:
  push:
    branches: [main]
    tags: ['*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write
  statuses: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v3
        with:
          version: '1'
      - uses: julia-actions/cache@v3
      - name: Check out the R reference source
        uses: actions/checkout@v7
        with:
          repository: vandenman/PDMPSamplersR
          path: r-package
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: renv
          working-directory: docs
          use-public-rspm: true
      - uses: r-lib/actions/setup-pandoc@v2
      - uses: quarto-dev/quarto-actions/setup@v2
      - name: Install R system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libcurl4-openssl-dev libssl-dev libxml2-dev libfontconfig1-dev libfreetype6-dev libharfbuzz-dev libfribidi-dev libpng-dev libtiff-dev libjpeg-dev
      - name: Cache R documentation packages
        uses: actions/cache@v4
        with:
          path: |
            docs/renv/library
            ~/.cache/R/renv
          key: docs-renv-${{ runner.os }}-${{ hashFiles('docs/renv.lock', 'docs/renv/profiles/examples/renv.lock') }}
      - name: Install documentation dependencies
        run: docs/instantiate.sh
      - name: Smoke test Julia Stan examples
        run: julia --project=docs docs/smoke/stan_workflows.jl --language julia
      - name: Execute R examples and regenerate their output
        env:
          GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
        run: docs/update-examples.sh r-package
      - name: Build and validate documentation
        run: docs/build.sh r-package
      - name: Deploy validated documentation
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          JULIA_DEBUG: "Documenter"
        run: julia --project=docs docs/deploy.jl
